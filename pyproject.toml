[project]
name = "procyon"
version = "1.0.0"
description = "Composable architecture for adaptive game level design generation."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pydantic>=2.7", "matplotlib>=3.8", "tqdm>=4.66"]
[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
ml = ["scikit-learn>=1.5"]
llm = ["llama-cpp-python>=0.2"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.mypy]
python_version = "3.11"
strict = true
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

